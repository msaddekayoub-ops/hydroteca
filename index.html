        }
        function modalEditDepense(id) {
            const p = getProject(); const d = p.depenses.find(x => x.id === id); if (!d) return;
            openModal('Modifier Dépense', 'fa-pen', `
    <div class="form-row"><div class="form-group"><label>Date</label><input class="form-input" type="date" id="f-dep-date" value="${d.date}"></div><div class="form-group"><label>Catégorie</label><select class="form-input" id="f-dep-cat">${CATEGORIES_DEPENSE.map(c => `<option${d.categorie === c ? ' selected' : ''}>${c}</option>`).join('')}</select></div></div>
    <div class="form-group"><label>Description</label><input class="form-input" id="f-dep-desc" value="${d.description || ''}"></div>
    <div class="form-group"><label>Montant (DH)</label><input class="form-input" type="number" id="f-dep-montant" value="${d.montant}"></div>
  `, `<button class="topbar-btn" onclick="closeModal()">Annuler</button><button class="topbar-btn primary" onclick="saveDepense('${id}')">Enregistrer</button>`);
        }
        function saveDepense(editId) {
            const p = getProject();
            const data = { date: document.getElementById('f-dep-date').value, categorie: document.getElementById('f-dep-cat').value, description: document.getElementById('f-dep-desc').value.trim(), montant: parseNum(document.getElementById('f-dep-montant').value) };
            if (data.montant <= 0) { toast('Montant invalide', 'danger'); return; }
            if (editId) { const d = p.depenses.find(x => x.id === editId); if (d) Object.assign(d, data); toast('Dépense modifiée'); }
            else { p.depenses.push({ id: uid(), ...data }); toast('Dépense ajoutée'); }
            save(); closeModal(); renderPage();
        }
        function deleteDepense(id) { const p = getProject(); p.depenses = p.depenses.filter(x => x.id !== id); save(); renderPage(); toast('Dépense supprimée', 'info'); }

        function exportDepenses() {
            const p = getProject(); if (!p || p.depenses.length === 0) { toast('Aucune dépense à exporter', 'danger'); return; }
            const sorted = [...p.depenses].sort((a, b) => parseDate(a.date) - parseDate(b.date));
            let csv = '\ufeffDate;Catégorie;Description;Montant (DH)\n';
            sorted.forEach(d => { csv += `${d.date};${d.categorie};${d.description || ''};${d.montant}\n`; });
            dlCSV(csv, `depenses_${p.nom}_${dateISO(new Date())}.csv`);
            toast('Export Excel téléchargé ✓');
        }

        function exportStock() {
            const p = getProject(); if (!p || p.stock.length === 0) { toast('Aucun article dans le stock', 'danger'); return; }
            let csv = '\ufeffArticle;Unité;Stock Actuel;Seuil Alerte;Prix Unitaire (DH);Valeur Stock (DH)\n';
            p.stock.forEach(s => {
                csv += `${s.article};${s.unite};${s.stockActuel};${s.seuilAlerte};${s.prixUnitaire};${s.stockActuel * s.prixUnitaire}\n`;
            });
            csv += '\n\ufeffMouvements de Stock\nDate;Article;Type;Quantité;Détails;N° Bon\n';
            const mouvs = [...p.mouvementsStock].sort((a, b) => parseDate(a.date) - parseDate(b.date));
            mouvs.forEach(m => {
                const art = p.stock.find(s => s.id === m.articleId);
                csv += `${m.date};${art ? art.article : '?'};${m.type === 'entree' ? 'Entrée' : 'Sortie'};${m.quantite};${m.details || ''};${m.bonNumero || ''}\n`;
            });
            dlCSV(csv, `stock_${p.nom}_${dateISO(new Date())}.csv`);
            toast('Export Stock Excel téléchargé ✓');
        }

        function exportMateriels() {
            const p = getProject(); if (!p || p.materiels.length === 0) { toast('Aucun matériel enregistré', 'danger'); return; }
            let csv = '\ufeffMatériel;Locataire;Prix Jour (DH);Unité;Total Jours;Total NHT (h);Total Gasoil (L);Total Coût (DH)\n';
            p.materiels.forEach(eq => {
                const pts = p.pointageMateriel.filter(pt => pt.equipementId === eq.id);
                const totalNHT = pts.reduce((s, pt) => s + parseNum(pt.nht), 0);
                const totalJ = parseFloat((totalNHT / 9).toFixed(2));
                const totalFuel = pts.reduce((s, pt) => s + parseNum(pt.gasoil), 0);
                const totalCout = pts.reduce((s, pt) => s + parseNum(pt.prixJ), 0);
                csv += `${eq.type};${eq.locataire || ''};${eq.prixJour};${eq.unitePrix};${totalJ};${totalNHT};${totalFuel};${totalCout}\n`;
            });
            csv += '\n\ufeffDétail Pointage Journalier\nMatériel;Date;NHT (h);Gasoil (L);Description;Type Panne;Durée Panne (h);Rendement;Prix Jour (DH);Observation\n';
            const allPts = [...p.pointageMateriel].sort((a, b) => parseDate(a.date) - parseDate(b.date));
            allPts.forEach(pt => {
                const eq = p.materiels.find(e => e.id === pt.equipementId);
                csv += `${eq ? eq.type : '?'};${pt.date};${pt.nht || 0};${pt.gasoil || 0};${pt.description || ''};${pt.panneType || ''};${pt.panNbrH || 0};${pt.rendement || ''};${pt.prixJ || 0};${pt.observation || ''}\n`;
            });
            dlCSV(csv, `materiels_${p.nom}_${dateISO(new Date())}.csv`);
            toast('Export Matériels Excel téléchargé ✓');
        }

        function exportPersonnel() {
            const p = getProject(); if (!p || p.personnel.length === 0) { toast('Aucun personnel enregistré', 'danger'); return; }
            let csv = '\ufeffNom;Fonction;CIN;Prix Jour (DH);Total Jours;Total Salaire (DH);Total Avances (DH);Reste (DH)\n';
            p.personnel.forEach(pe => {
                const jours = p.pointagePersonnel.filter(pp => pp.personnelId === pe.id).reduce((s, pp) => s + pp.presence, 0);
                const salaire = Math.round(jours * pe.prixJour);
                const avances = p.avances.filter(a => a.personnelId === pe.id).reduce((s, a) => s + a.montant, 0);
                const reste = Math.max(0, salaire - avances);
                csv += `${pe.nom};${pe.fonction};${pe.cin || ''};${pe.prixJour};${jours};${salaire};${avances};${reste}\n`;
            });
            csv += '\n\ufeffDétail Pointage Personnel\nNom;Fonction;Date;Présence\n';
            const allPP = [...p.pointagePersonnel].sort((a, b) => parseDate(a.date) - parseDate(b.date));
            allPP.forEach(pp => {
                const pe = p.personnel.find(x => x.id === pp.personnelId);
                csv += `${pe ? pe.nom : '?'};${pe ? pe.fonction : ''};${pp.date};${pp.presence === 1 ? 'Présent' : 'Demi-Journée'}\n`;
            });
            csv += '\n\ufeffAvances\nNom;Date;Montant (DH)\n';
            p.avances.forEach(a => {
                const pe = p.personnel.find(x => x.id === a.personnelId);
                csv += `${pe ? pe.nom : '?'};${a.date};${a.montant}\n`;
            });
            dlCSV(csv, `personnel_${p.nom}_${dateISO(new Date())}.csv`);
            toast('Export Personnel Excel téléchargé ✓');
        }

        function dlCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // SÉLECTEUR DE PROJET
        // ============================================================
        function updateProjectSelector() {
            const sel = document.getElementById('sel-project');
            sel.innerHTML = state.projects.map(p => `<option value="${p.id}"${p.id === state.currentProjectId ? ' selected' : ''}>${p.nom}</option>`).join('');
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        function init() {
            if (!load()) { state.projects = []; state.currentProjectId = null; save(); }
            updateProjectSelector();

            // Navigation sidebar
            document.querySelectorAll('.nav-item').forEach(n => {
                n.addEventListener('click', () => navigate(n.dataset.page));
            });

            // Sélecteur de projet
            document.getElementById('sel-project').addEventListener('change', e => {
                state.currentProjectId = e.target.value; save(); renderPage();
            });

            // Fermer modal avec Escape
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
            document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });

            navigate(state.currentPage || 'dashboard');
        }

        init();
    </script>
</body>

</html>
